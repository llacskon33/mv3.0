name: Windows RDP persistente

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdp-persistente
  cancel-in-progress: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Restaurar archivos guardados
        shell: pwsh
        run: |
          $data = Join-Path $env:GITHUB_WORKSPACE "datos"
          $homeDir = $env:USERPROFILE
          $folders = @{
            "Documentos" = "$homeDir\Documents"
            "Descargas"  = "$homeDir\Downloads"
            "Escritorio" = "$homeDir\Desktop"
          }
          foreach ($name in $folders.Keys) {
            $source = Join-Path $data $name
            $dest = $folders[$name]
            if (Test-Path $source) {
              Copy-Item -LiteralPath "$source\*" -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
            } else {
              New-Item -ItemType Directory -Path $source -Force | Out-Null
            }
          }

      - name: Configurar e iniciar RDP
        shell: pwsh
        run: |
          # Habilitar Escritorio Remoto en el Registro
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Escritorio remoto"
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService" -WarningAction SilentlyContinue

      - name: Crear usuario RDP
        shell: pwsh
        run: |
          $bytes = New-Object byte[] 16
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes) + "aA7!"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          
          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($user) {
            Set-LocalUser -Name "runneradmin" -Password $secure
            Add-LocalGroupMember -Group "Administradores" -Member "runneradmin" -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Usuarios de escritorio remoto" -Member "runneradmin" -ErrorAction SilentlyContinue
          }
          
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "CREDENCIALES DE ACCESO RDP:" -ForegroundColor Green
          Write-Host "Usuario: runneradmin" -ForegroundColor Yellow
          Write-Host "Contraseña: $password" -ForegroundColor Yellow
          Write-Host "==============================================" -ForegroundColor Cyan

      - name: Instalar y configurar Ngrok
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if (-not $env:NGROK_AUTH_TOKEN) {
            Write-Error "Falta el secreto NGROK_AUTH_TOKEN en tu repositorio."
            exit 1
          }
          choco install ngrok -y
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout" -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          # Obtener la URL pública asignada por Ngrok
          $ngrokApi = Invoke-RestMethod -Uri "http://127.0.0"
          $publicUrl = $ngrokApi.tunnels[0].public_url
          $cleanUrl = $publicUrl -replace "tcp://", ""
          
          Write-Host "==============================================" -ForegroundColor Cyan
          Write-Host "DIRECCIÓN DE CONEXIÓN RDP:" -ForegroundColor Green
          Write-Host "$cleanUrl" -ForegroundColor Magenta
          Write-Host "==============================================" -ForegroundColor Cyan

      - name: Mantener activo y Auto-Guardar al finalizar
        shell: pwsh
        run: |
          $data = Join-Path $env:GITHUB_WORKSPACE "datos"
          $homeDir = $env:USERPROFILE
          $folders = @{
            "Documentos" = "$homeDir\Documents"
            "Descargas"  = "$homeDir\Downloads"
            "Escritorio" = "$homeDir\Desktop"
          }
          
          Write-Host "Ejecutor RDP activo. Esperando 5 horas..."
          # Bucle de 300 minutos (5 horas) dejando 50 min de margen de seguridad para guardar cambios
          for ($i = 0; $i -lt 300; $i++) {
            Start-Sleep -Seconds 60
          }
          
          Write-Host "Tiempo límite alcanzado o cancelación. Guardando archivos en el repositorio..."
          foreach ($name in $folders.Keys) {
            $source = $folders[$name]
            $dest = Join-Path $data $name
            if (Test-Path $source) {
              Copy-Item -LiteralPath "$source\*" -Destination $dest -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          
          # Subir cambios al repositorio de manera automática
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add datos/
          git commit -m "Auto-guardado de sesión RDP [skip ci]"
          git push origin main || Write-Warning "No hubo cambios para guardar o falló el push."
